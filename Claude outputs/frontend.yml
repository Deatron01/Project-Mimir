# Frontend CI (FE-TH-04, FE-I18N-03, TOP-15, TOP-16): theme contrast, i18n parity, API types, typecheck,
# lint, unit tests, production build, then Playwright E2E + axe against the mock API.
name: frontend

on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Theme contrast (WCAG AA, 6 palettes × 2 modes)
        run: npm run check:theme
      - name: i18n parity and key usage
        run: npm run check:i18n
      - name: API types match the OpenAPI spec
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and component tests
        run: npm run test:coverage
      - name: Production build (legacy mode, as deployed today)
        run: npm run build
      - name: Build (v1 + mocks, as used by previews)
        run: npx vite build --mode e2e --outDir dist-e2e

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E + accessibility (axe, every palette × mode)
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
