<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimir – kiértékelés</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#151513;--ink2:#55544f;--ink3:#8a8983;--line:#e4e3dd;--grid:#eeede8;
--accent:#2a78d6;--f-base:#8a8983;--f-pipeline:#2a78d6;--f-server:#eb6834;--f-chunk:#1baf7a;--f-other:#4a3aa7;
--s1:#2a78d6;--s2:#eb6834;--pos:#2a78d6;--neg:#e34948;
--good:#1f7a3a;--goodbg:#e6f4ea;--bad:#b3261e;--badbg:#fbe9e7;--warn:#8a5a00;--warnbg:#fdf3dc;--key:#e6f4ea;--hl:#eef4fc}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1c1c1a;--ink:#f2f1ec;--ink2:#b8b6ad;--ink3:#86847c;--line:#33322e;--grid:#2a2926;
--accent:#3987e5;--f-base:#86847c;--f-pipeline:#3987e5;--f-server:#d95926;--f-chunk:#199e70;--f-other:#9085e9;
--s1:#3987e5;--s2:#d95926;--pos:#3987e5;--neg:#e66767;
--good:#7fd29a;--goodbg:#1d3325;--bad:#f28b82;--badbg:#3a1f1d;--warn:#f0c46a;--warnbg:#3a3018;--key:#1d3325;--hl:#1e2733}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
code{font-size:12.5px;background:var(--grid);padding:1px 5px;border-radius:5px}
.top{display:flex;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25}.brand b{font-size:16px}.brand span{font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}.tabs button{border:0;background:none;color:var(--ink2);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.tabs button:hover{background:var(--bg)}.tabs button.on{background:var(--hl);color:var(--ink);font-weight:600}
.langsw{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink2);padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}.seg button.on{background:var(--accent);color:#fff}
.view{flex:1;overflow:auto;min-height:0}.view[hidden]{display:none}
.pad{padding:26px 28px 60px;max-width:1240px;margin:0 auto}
h1{font-size:24px;line-height:1.25;margin:0 0 6px}h2{font-size:18px;margin:34px 0 4px}h3{font-size:15px;margin:18px 0 6px}
.lead{color:var(--ink2);font-size:15px;max-width:860px;margin:0 0 18px}
.note{color:var(--ink2);font-size:13px;margin:2px 0 12px;max-width:900px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.find{border-left:4px solid var(--accent)}.find ul{margin:6px 0 0;padding-left:20px}.find li{margin:5px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.tile .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3}.tile .l{font-size:12.5px;color:var(--ink2)}
.tile.warn{border-color:var(--warn)}.tile.bad{border-color:var(--bad)}
.warns{list-style:none;padding:0;margin:0}.warns li{padding:9px 12px;border-radius:10px;background:var(--warnbg);margin:7px 0;font-size:13.5px}
.warns li b{color:var(--warn)}
details.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
details.box>summary{font-weight:600;color:var(--ink);font-size:14.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);align-items:center;margin:6px 0 10px}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.sq{display:inline-block;width:10px;height:10px;transform:rotate(45deg);margin-right:6px;vertical-align:0}
/* ranking / steps / language rows */
.rows{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px 12px}
.r{display:grid;grid-template-columns:minmax(170px,300px) 1fr 150px;gap:12px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid)}
.r:last-child{border-bottom:0}.r.click{cursor:pointer}.r.click:hover{background:var(--hl);border-radius:8px}
.rl{font-size:13.5px;line-height:1.3;min-width:0}.rl b{margin-right:6px}.rl span{color:var(--ink2)}
.rv{font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right}.rv small{display:block;color:var(--ink3);font-size:11.5px}
.trk{position:relative;height:22px}
.trk .ax{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.trk .base{position:absolute;top:-6px;bottom:-6px;width:0;border-left:1.5px dashed var(--ink3);opacity:.7}
.trk .ci{position:absolute;top:9px;height:4px;border-radius:2px;opacity:.35}
.trk .dot{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--panel)}
.trk .dia{position:absolute;top:5px;width:11px;height:11px;margin-left:-5.5px;transform:rotate(45deg);border:1.5px solid var(--panel)}
.trk .link{position:absolute;top:10px;height:2px;background:var(--ink3);opacity:.5}
.trk .zero{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink3)}
.trk .bar{position:absolute;top:4px;height:14px;border-radius:4px}
.axis{display:grid;grid-template-columns:minmax(170px,300px) 1fr 150px;gap:12px;font-size:11.5px;color:var(--ink3);padding:0 0 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.axis .ticks{position:relative;height:16px}.axis .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis .ticks span.first{transform:none}.axis .ticks span.last{transform:translateX(-100%)}
.fam{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--ink2);background:var(--panel);position:sticky;top:0;z-index:1;font-size:12px}
th.grp{text-align:center;border-bottom:1px solid var(--line);color:var(--ink);font-size:12px;background:var(--bg)}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}th.l,td.l{text-align:left}td.wrap{white-space:normal}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--hl)}
tr.sep td{background:var(--bg);font-weight:600;color:var(--ink2);text-align:left;font-size:12px}
.hm td{text-align:center;min-width:56px}.hm td.l{text-align:left}.hm td.c{cursor:pointer}.hm td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap;display:inline-block;vertical-align:1px}
.ok{background:var(--goodbg);color:var(--good);border-color:transparent}.no{background:var(--badbg);color:var(--bad);border-color:transparent}
.mid{background:var(--warnbg);color:var(--warn);border-color:transparent}
.flagv{color:var(--bad);font-weight:600}.muted{color:var(--ink3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
svg text{fill:var(--ink2);font-size:11px}svg .lab{fill:var(--ink);font-size:11.5px;font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;
box-shadow:0 6px 20px rgba(0,0,0,.16);max-width:380px;z-index:50;display:none;white-space:pre-line;line-height:1.45}
select,input[type=search]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button.btn{padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
button.btn:hover{border-color:var(--accent)}
dl.gl{display:grid;grid-template-columns:minmax(160px,230px) 1fr;gap:0;margin:0}
dl.gl dt,dl.gl dd{padding:9px 10px;border-bottom:1px solid var(--grid);margin:0}dl.gl dt{font-weight:600}dl.gl dd{color:var(--ink2)}
.verdict{font-size:15px;background:var(--hl);border-radius:12px;padding:12px 14px;margin:10px 0 14px}
/* exams */
.app{display:grid;grid-template-columns:310px 1fr;height:100%}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
aside label{display:block;font-size:12px;color:var(--ink2);margin:12px 0 4px}aside select,aside input[type=search]{width:100%}
.exmain{overflow:auto;padding:20px 28px}
.exam{display:block;width:100%;text-align:left;padding:7px 9px;margin:3px 0;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
.exam:hover{background:var(--bg)}.exam.on{border-color:var(--accent);background:var(--hl)}.exam small{color:var(--ink2);display:block}
.head h2{margin:0 0 6px;font-size:18px}.stat{font-size:13px;color:var(--ink2)}
.toggle{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:12px}.toggle label{margin:0}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.q.flag{border-left:4px solid var(--bad)}.qt{font-weight:600;margin:6px 0 8px}
.q ol{margin:0 0 8px;padding-left:22px}.q li{padding:3px 6px;border-radius:6px;margin:2px 0}.q li.key{background:var(--key);font-weight:600}
details{margin-top:8px}summary{cursor:pointer;color:var(--ink2);font-size:13px}
.src{white-space:pre-wrap;font-size:13px;background:var(--bg);border-radius:8px;padding:10px;margin-top:6px;max-height:320px;overflow:auto}
.why{font-size:13px;color:var(--ink2);margin-top:6px}.empty{color:var(--ink2);padding:40px 0}
.ctx{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px;white-space:pre-wrap;background:var(--bg)}
.ctx.tiny{border-color:var(--bad);background:var(--badbg)}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;max-width:820px;margin:0 auto;padding:42px 54px;
font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.55;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.paper .pt{font-size:22px;font-weight:700;text-align:center;margin:0 0 4px}.paper .pm{text-align:center;color:#555;font-size:13px;margin-bottom:18px;font-family:system-ui,sans-serif}
.paper .pn{display:flex;justify-content:space-between;gap:12px;border-top:1.5px solid #111;border-bottom:1px solid #999;padding:10px 0;margin-bottom:12px;font-size:14px;flex-wrap:wrap}
.paper .pi{font-style:italic;margin:0 0 18px}
.paper ol.pq{padding-left:26px;margin:0}.paper ol.pq>li{margin:0 0 20px;page-break-inside:avoid;break-inside:avoid}
.paper .ps{font-weight:600;margin-bottom:6px}.paper .po{display:grid;gap:3px;padding-left:4px}
.paper .opt{display:flex;gap:10px;align-items:baseline;padding:2px 6px;border-radius:4px}
.paper .bub{display:inline-flex;width:22px;height:22px;border:1.3px solid #333;border-radius:50%;align-items:center;justify-content:center;font-size:12px;flex:none;font-family:system-ui,sans-serif}
.paper .opt.right{background:#e3f3e7}.paper .opt.right .bub{background:#1f7a3a;border-color:#1f7a3a;color:#fff}
.paper .lines{border-bottom:1px solid #999;height:26px;margin:4px 0}
.paper .akey{margin-top:26px;border-top:1.5px solid #111;padding-top:10px;font-family:system-ui,sans-serif;font-size:13px}
.paper .akey span{display:inline-block;margin:2px 14px 2px 0}
.paper .pflag{font-family:system-ui,sans-serif;font-size:11px;color:#b3261e;margin-left:6px;font-weight:400}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.app{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}
.paper{padding:24px 18px}.pad{padding:18px 16px 50px}.r,.axis{grid-template-columns:120px 1fr 92px;gap:8px}.rl span{display:none}.langsw{margin-left:0}}
@media print{.top,aside,.noprint{display:none!important}body{display:block;background:#fff}.view{overflow:visible}.app{display:block;height:auto}
.exmain{overflow:visible;padding:0}.paper{border:0;box-shadow:none;max-width:none;padding:0}.paper .pflag{display:none}}
</style>
</head>
<body>
<div class="top noprint">
  <div class="brand"><b id="t-title"></b><span id="gen"></span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="langsw seg" id="langsw"><button data-l="hu">Magyar</button><button data-l="en">English</button></div>
</div>
<section class="view" id="v-summary"><div class="pad" id="summary"></div></section>
<section class="view" id="v-methods" hidden><div class="pad" id="methods"></div></section>
<section class="view" id="v-documents" hidden><div class="pad" id="documents"></div></section>
<section class="view" id="v-compare" hidden><div class="pad" id="compare"></div></section>
<section class="view" id="v-exams" hidden>
<div class="app">
<aside>
  <label for="run" id="t-run"></label><select id="run"></select>
  <div class="stat" id="rundesc"></div>
  <label for="find" id="t-find"></label><input id="find" type="search">
  <div class="toggle"><input type="checkbox" id="problems"><label for="problems" id="t-problems"></label></div>
  <label id="t-exams"></label><div id="exams"></div>
</aside>
<div class="exmain" id="main"></div>
</div>
</section>
<div id="tip"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const RUNS = D.runs, SUM = D.summary, DOCS = D.docs, PERDOC = D.perdoc, ARMINFO = D.arms || {};
const ARMS = SUM.map(r => r.arm);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang = 'hu';
try { const s = localStorage.getItem('mimir-viewer-lang'); if (s === 'en' || s === 'hu') lang = s; } catch (e) {}
const L = (hu, en) => lang === 'hu' ? hu : en;
const nf = (v, d = 2) => v == null || isNaN(v) ? '–' : (lang === 'hu' ? v.toFixed(d).replace('.', ',') : v.toFixed(d));
const sg = (v, d = 2) => v == null ? '–' : (v >= 0 ? '+' : '−') + nf(Math.abs(v), d);
const pc = v => v == null ? '–' : Math.round(v * 100) + '%';
const pp = v => v == null ? '–' : (v >= 0 ? '+' : '−') + Math.abs(Math.round(v * 100)) + L(' %-pont', ' pp');
const du = s => s == null ? '–' : s < 90 ? Math.round(s) + L(' mp', ' s') : nf(s / 60, 1) + L(' perc', ' min');
const pv = p => p == null ? '–' : p < 0.001 ? '< 0' + (lang === 'hu' ? ',' : '.') + '001' : nf(p, 3);
const LETTERS = 'ABCDEFGHIJ';
const latestRun = arm => RUNS.find(r => r.arm === arm && r.latest);
const sumOf = arm => SUM.find(r => r.arm === arm);
const info = arm => ARMINFO[arm] || {family: 'other', en: arm, hu: arm, desc_en: '', desc_hu: ''};
const aname = arm => L(info(arm).hu, info(arm).en);
const adesc = arm => L(info(arm).desc_hu, info(arm).desc_en);
const famColor = arm => `var(--f-${info(arm).family || 'other'})`;
const FAMS = {base: ['Kiindulási módszerek', 'Baselines'], pipeline: ['Tervezés és ellenőrzés', 'Planning & verification'],
              server: ['Egyetemi szervermodell', 'University server model'], chunk: ['Darabolási változatok', 'Chunking variants'], other: ['Egyéb', 'Other']};
const famName = f => L(...(FAMS[f] || FAMS.other));
function chip(label, state = '', tip = '') { return `<span class="chip ${state}"${tip ? ` data-tip="${esc(tip)}"` : ''}>${esc(label)}</span>`; }
function yesno(v, yes, no) { return v == null ? '' : chip(v ? yes : no, v ? 'ok' : 'no'); }
function tint(g) { g = Math.max(0, Math.min(1, g)); return `color-mix(in srgb, var(--accent) ${Math.round(g * 30)}%, var(--panel))`; }
function shade(g) { g = Math.max(0, Math.min(1, g)); return `color-mix(in srgb, var(--accent) ${Math.round(4 + g * 46)}%, var(--panel))`; }
const where = r => r.local ? chip(L('helyi', 'local'), '', L('A gépen futó modell (Ollama)', 'Model running on the local GPU (Ollama)')) : chip(L('szerver', 'server'), 'mid', L('Az egyetemi GenAI szerver modellje', "The university GenAI server's model"));
const mean = v => v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
const JUDGE = (SUM.find(r => r.judge) || {}).judge || 'gpt-oss:120b';
/* Hungarian definite article for a code or word: az E2, a B-doc-S; capitalised at sentence start */
const art = (w, cap = false) => { if (lang !== 'hu') return ''; const a = /^[aeiouáéíóöőúüű15]/i.test(String(w)) ? 'az' : 'a'; return (cap ? a[0].toUpperCase() + a.slice(1) : a) + ' '; };
const SUBJ = {humanities: ['bölcsészet', 'humanities'], economics: ['közgazdaságtan', 'economics'], law: ['jog', 'law'],
              life_sciences: ['élettudományok', 'life sciences'], lifesciences: ['élettudományok', 'life sciences']};
const DIFF = {easy: ['könnyű', 'easy'], medium: ['közepes', 'medium'], hard: ['nehéz', 'hard']};
const subj = (s, lg = lang) => SUBJ[s] ? SUBJ[s][lg === 'hu' ? 0 : 1] : (s || '');
const diff = (s, lg = lang) => DIFF[s] ? DIFF[s][lg === 'hu' ? 0 : 1] : (s || '');

/* ---------------- metric definitions (one place for names, direction and meaning) ---------------- */
const MET = {
  qi: {hu: 'Minőségi index', en: 'Quality index', sh: ['Index', 'Index'], dir: 1, t: 'num',
       d: ['A négy alapmutató (formai megfelelés, forrással igazolt, vakon megoldható, jó disztraktorok) átlaga, előbb dokumentumonként, aztán a dokumentumokra. Értéke 0 és 1 közötti.',
           'Mean of the four core measures (format, grounded, blind-solvable, good distractors), first per document, then over documents. Ranges from 0 to 1.']},
  format_compliant: {hu: 'Formai megfelelés', en: 'Format compliance', sh: ['Forma', 'Format'], dir: 1, t: 'pct', idx: 1,
       d: ['A vizsgában annyi, jól formázott kérdés van, amennyit kértünk (10 kérdés, opciók, pontosan egy helyes válasz).', 'The exam has as many well-formed questions as requested (10 questions, options, exactly one correct answer).']},
  grounding_rate: {hu: 'Forrással igazolt', en: 'Grounded', sh: ['Igazolt', 'Grounded'], dir: 1, t: 'pct', idx: 1,
       d: ['A bíráló szerint a megjelölt helyes válasz tényleg következik a forrásszövegből.', 'The judge finds the keyed answer supported by the source text.']},
  blind_answerability: {hu: 'Vakon megoldható', en: 'Blind-solvable', sh: ['Vak', 'Blind'], dir: 1, t: 'pct', idx: 1,
       d: ['A bíráló a kulcs ismerete nélkül, csak a forrásból megoldja a kérdést, és ugyanazt a választ jelöli. Ha nem, a kérdés félreérthető vagy a kulcs rossz.', 'The judge answers from the source without seeing the key and picks the keyed option. If not, the question is ambiguous or the key is wrong.']},
  distractor_validity: {hu: 'Jó disztraktorok', en: 'Good distractors', sh: ['Disztr.', 'Distr.'], dir: 1, t: 'pct', idx: 1,
       d: ['A rossz válaszlehetőségek (disztraktorok) közül hány tényleg rossz a forrás szerint.', 'Share of the wrong options (distractors) that are really wrong according to the source.']},
  dup_share: {hu: 'Ismétlődő kérdés', en: 'Repeated questions', sh: ['Ismétlés', 'Repeats'], dir: -1, t: 'pct', bad: .15,
       d: ['Azon kérdések aránya, amelyek ugyanannak a vizsgának egy korábbi kérdését ismétlik (azonos vagy majdnem azonos szöveg). Nincs benne az indexben.', 'Share of questions that repeat an earlier question of the same exam (same or near-identical wording). Not part of the index.']},
  nonq_share: {hu: 'Nem kérdés formájú', en: 'Not a question', sh: ['Nem kérdés', 'Not a Q'], dir: -1, t: 'pct', bad: .15,

      <div class="rv"><b>${sg(s.md)}</b><small>${s.n} ${L('dok.', 'docs')} · ${s.up}↑ ${s.down}↓ · p ${pv(s.w.p)}</small></div></div>`;

function langRows() {

      <div class="trk">${a != null && b != null ? `<span class="link" style="left:${Math.min(X(a), X(b))}%;width:${Math.abs(X(a) - X(b))}%"></span>` : ''}
        ${a != null ? `<span class="dot" style="left:${X(a)}%;background:var(--s1)"></span>` : ''}${b != null ? `<span class="dia" style="left:${X(b)}%;background:var(--s2)"></span>` : ''}</div>

}
function scatter() {
  const pts = SUM.filter(r => r.qi != null && r.time_s);
  if (!pts.length) return '';
  const W = 620, H = 330, Lm = 46, R = 16, T = 12, B = 40;
  const tmin = Math.min(...pts.map(r => r.time_s / 60)), tmax = Math.max(...pts.map(r => r.time_s / 60));
  const x0 = Math.log10(tmin / 1.5), x1 = Math.log10(tmax * 2.2);
  const y0 = Math.max(0, Math.floor(Math.min(...pts.map(r => r.qi)) * 10) / 10 - 0.05), y1 = 1.0;
  const X = t => Lm + (Math.log10(t) - x0) / (x1 - x0) * (W - Lm - R), Y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  let g = '';
  [0.1, 0.3, 1, 3, 10, 30, 100, 300].filter(t => Math.log10(t) >= x0 && Math.log10(t) <= x1).forEach(t =>
    g += `<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H - B}" stroke="var(--grid)"/><text x="${X(t)}" y="${H - B + 15}" text-anchor="middle">${nf(t, t < 1 ? 1 : 0)}</text>`);
  for (let v = Math.ceil(y0 * 10) / 10; v <= y1 + 1e-9; v += 0.1)
    g += `<line x1="${Lm}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${Lm - 6}" y="${Y(v) + 4}" text-anchor="end">${nf(v, 1)}</text>`;
  g += `<text x="${(Lm + W - R) / 2}" y="${H - 6}" text-anchor="middle">${L('perc / vizsga (logaritmikus skála)', 'minutes per exam (log scale)')}</text>`;
  g += `<text transform="translate(12 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">${L('minőségi index', 'quality index')}</text>`;
  g += `<text x="${Lm + 6}" y="${T + 12}" style="font-weight:600">${L('↖ gyors és jó', '↖ fast and good')}</text>`;
  const placed = [];
  let dots = '', labs = '';
  const order = [...pts].sort((a, b) => b.qi - a.qi);
  order.forEach(r => {
    const cx = X(r.time_s / 60), cy = Y(r.qi);
    placed.push({x: cx - 6, y: cy - 6, w: 12, h: 12});
    const t = `${r.arm} – ${aname(r.arm)}\n${mName('qi')}: ${nf(r.qi)}\n${mName('time_s')}: ${du(r.time_s)} · ${mName('calls')}: ${r.calls ?? '–'}`;
    dots += `<g data-tip="${esc(t)}" style="cursor:pointer" data-open="${esc(r.run)}"><circle cx="${cx}" cy="${cy}" r="12" fill="transparent"/>
      <circle cx="${cx}" cy="${cy}" r="6" fill="${famColor(r.arm)}" stroke="var(--panel)" stroke-width="2"/></g>`;
  });
  order.forEach(r => {
    const cx = X(r.time_s / 60), cy = Y(r.qi), w = r.arm.length * 7 + 2;
    for (const [dx, dy] of [[9, 0], [-9 - w, 0], [9, -12], [9, 12], [-9 - w, -12], [-9 - w, 12], [9, -24], [9, 24]]) {
      const box = {x: cx + dx, y: cy + dy - 8, w, h: 12};
      if (box.x < Lm || box.x + w > W) continue;
      if (!placed.some(p => box.x < p.x + p.w && p.x < box.x + box.w && box.y < p.y + p.h && p.y < box.y + box.h)) {
        placed.push(box); labs += `<text class="lab" x="${box.x}" y="${box.y + 10}">${esc(r.arm)}</text>`; break;
      }
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${L('Minőség és idő', 'Quality vs time')}">${g}${dots}${labs}</svg>`;
}
const TCOLS = [

    `<b>${esc(cmpB)}</b> is ${better ? 'better than' : worse ? 'worse than' : 'about the same as'} <b>${esc(cmpA)}</b>: ${sg(P.md)} in quality index on average, better on ${P.up} and worse on ${P.down} of ${P.n} common documents. ${sig ? `The difference is significant at p = ${pv(P.w.p)} (uncorrected).` : `The difference is not significant (p = ${pv(P.w.p)})${P.n < 10 ? `; with ${P.n} documents even the smallest possible p is ${pv(2 / 2 ** P.n)}` : ''}.`}`);

    <div class="row" style="margin-bottom:6px"><b>${L('Referencia', 'Reference')}</b> <select id="ca">${opts(cmpA)}</select> <b>${L('új', 'new')}</b> <select id="cb">${opts(cmpB)}</select>
      <button class="btn" id="swap">⇄ ${L('csere', 'swap')}</button></div>
    <div class="verdict">${verdict}</div>
    ${onlyA.length || onlyB.length ? `<ul class="warns"><li>${L('<b>Nem ugyanazok a dokumentumok.</b> Csak ', '<b>Not the same documents.</b> Only ')}${esc(cmpA)}: ${esc(onlyA.join(', ') || '–')}. ${L('Csak ', 'Only ')}${esc(cmpB)}: ${esc(onlyB.join(', ') || '–')}. ${L('Ezek kimaradnak.', 'These are ignored.')}</li></ul>` : ''}

      <div><h2 style="margin-top:8px">${L('Dokumentumonként', 'Per document')}</h2>
      <div class="rows"><div class="axis"><div>${L('Dokumentum', 'Document')}</div><div class="ticks"><span class="first" style="left:0%">${sg(-m)}</span><span style="left:50%">0</span><span class="last" style="left:100%">${sg(m)}</span></div><div style="text-align:right">${esc(cmpA)} → ${esc(cmpB)}</div></div>
      ${P.rows.map(x => { const d = x.b - x.a, X = v => 50 + v / m * 50, l = Math.min(X(0), X(d)), w = Math.abs(X(d) - X(0));
        return `<div class="r"><div class="rl"><b style="font-weight:500">${esc(x.d)}</b><span class="muted">${esc((DOCS[x.d] || {}).language || '')}</span></div>

      <div><h2>${L('Mutatónként', 'Per metric')}</h2><div class="tw" style="max-width:900px"><table><thead><tr><th class="l">${L('Mutató', 'Metric')}</th><th>${esc(cmpA)}</th><th>${esc(cmpB)}</th><th>${L('Különbség', 'Difference')}</th><th>p</th></tr></thead><tbody>
      ${MK.map(k => { const Q = paired(cmpA, cmpB, k); if (!Q.n) return '';
        const t = MET[k].t, dd = Q.md, ds = t === 'pct' ? pp(dd) : sg(dd, t === 'five' ? 2 : 2), worseM = MET[k].dir < 0 ? dd > 0.005 : dd < -0.005;
        return `<tr><td class="l" data-tip="${esc(mDesc(k))}">${esc(mName(k))}</td><td>${mval(k, Q.ma)}</td><td>${mval(k, Q.mb)}</td><td class="${worseM ? 'flagv' : ''}">${ds}</td><td>${Q.w.n ? pv(Q.w.p) : '–'}</td></tr>`; }).join('')}
      </tbody></table></div><p class="note">${L('Piros = az új módszer ezen a mutatón rosszabb.', 'Red = the new arm is worse on this measure.')}</p></div>
    </div>`;
  $('#ca').onchange = () => { cmpA = $('#ca').value; renderCompare(); setHash(); };
  $('#cb').onchange = () => { cmpB = $('#cb').value; renderCompare(); setHash(); };
  $('#swap').onclick = () => { [cmpA, cmpB] = [cmpB, cmpA]; renderCompare(); setHash(); };
  bindLinks($('#compare'));

<script>
"use strict";

  en: {exam: 'Exam', name: 'Name', date: 'Date', score: 'Score', inst: 'Choose the one correct answer for each question.', key: 'Answer key', doc: 'Source', q: 'questions'},

function isProblem(q) {

         q.dup_of != null || q.is_question === false || (q.judge_correctness != null && q.judge_correctness <= 2) || q.judge_error;

function renderRuns() {

  $('#run').innerHTML = `<optgroup label="${L('Legutóbbi futás módszerenként', 'Latest run per arm')}">${lat.map(opt).join('')}</optgroup>${old.length ? `<optgroup label="${L('Korábbi futások', 'Older runs')}">${old.map(opt).join('')}</optgroup>` : ''}`;

function renderExams() {

    <div class="row">${chip(exam.status, exam.status === 'ok' ? 'ok' : 'no')}${chip(exam.language || '')}${chip(diff(exam.difficulty))}
      ${chip(`${s.n}/${exam.n_requested ?? '?'} ${L('kérdés', 'questions')}`, s.n === exam.n_requested ? 'ok' : 'no')}${chip(s.problems + ' ' + L('hibás', 'flagged'), s.problems ? 'mid' : 'ok')}
      <span style="flex:1"></span>
      <span class="seg"><button data-m="paper" class="${mode === 'paper' ? 'on' : ''}">${L('Feladatlap', 'Test paper')}</button><button data-m="review" class="${mode === 'review' ? 'on' : ''}">${L('Bírálat', 'Review')}</button></span>
      ${mode === 'paper' ? `<label class="row" style="gap:5px;font-size:13px"><input type="checkbox" id="ans" ${answers ? 'checked' : ''}>${L('Megoldások mutatása', 'Show answers')}</label><button class="btn" id="print">${L('Nyomtatás', 'Print')}</button>` : ''}</div>
    <div class="stat" style="margin-top:6px">${L('modell', 'model')} ${esc(exam.model || '–')}${exam.unverified != null ? ' · ' + L(`${exam.unverified} nem ellenőrzött, ${exam.replacements ?? 0} cserélve az ellenőrző által`, `${exam.unverified} unverified, ${exam.replacements ?? 0} replaced by the verifier`) : ''}</div>
    ${exam.error ? `<div class="why" style="color:var(--bad)">${esc(exam.error)}</div>` : ''}
    <div style="margin-top:12px">${tiles(exam)}</div>
    ${exam.retrieved.length ? `<details ${tinyCtx && mode === 'review' ? 'open' : ''}><summary>${L(`Amit a keresés a modellnek adott (${exam.retrieved.length} darab)`, `What retrieval gave the model (${exam.retrieved.length} chunks)`)}${tinyCtx ? ` – <b style="color:var(--bad)">${L('apró darabok!', 'tiny chunks!')}</b>` : ''}</summary>
      ${exam.retrieved.map(c => `<div class="ctx ${c.len < 50 ? 'tiny' : ''}"><span class="muted">#${c.rank ?? '?'} · ${L('darab', 'chunk')} ${c.chunk ?? '?'} · ${c.len} ${L('karakter', 'chars')}</span>\n${esc(c.text)}</div>`).join('')}</details>` : ''}
  </div>`;
  const body = !qs.length ? `<div class="empty">${L('Nincs a szűrésnek megfelelő kérdés.', 'No questions match.')}</div>` : mode === 'paper' ? renderPaper(exam, qs) : qs.map(([q, n]) => renderQuestion(q, n)).join('');
  $('#main').innerHTML = head + body;
  $('#main').querySelectorAll('.seg button').forEach(b => b.onclick = () => { mode = b.dataset.m; renderMain(); });
  if ($('#ans')) $('#ans').onchange = () => { answers = $('#ans').checked; renderMain(); };
  if ($('#print')) $('#print').onclick = () => window.print();
}
$('#find').oninput = renderMain; $('#problems').onchange = renderMain;
document.addEventListener('keydown', ev => {
  if (tab !== 'exams' || !run || ev.target.matches('input,select,textarea')) return;
  if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
  const i = run.exams.indexOf(exam), j = Math.max(0, Math.min(run.exams.length - 1, i + (ev.key === 'ArrowRight' ? 1 : -1)));
  if (j !== i) { exam = run.exams[j]; renderExams(); renderMain(); setHash(); ev.preventDefault(); }
});

/* ---------------- start ---------------- */
function route() {
  const [t, ...rest] = location.hash.slice(1).split('/').map(decodeURIComponent);
  const alias = {overview: 'summary'}, tt = alias[t] || t;
  if (tt === 'documents' && rest[0]) docSel = rest[0];
  if (tt === 'compare' && rest.length === 2 && ARMS.includes(rest[0]) && ARMS.includes(rest[1])) [cmpA, cmpB] = rest;
  if (tt === 'exams' && rest[0]) {
    run = RUNS.find(r => r.id === rest[0]) || run;
    exam = run && rest[1] ? run.exams.find(e => e.doc_id === rest[1] && String(e.seed) === rest[2]) || null : null;
  }
  if (run && !exam) exam = run.exams[0] || null;
  show(TABS.some(x => x[0] === tt) ? tt : (SUM.length ? 'summary' : 'exams'), false);
}
renderChrome();
renderRuns();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
