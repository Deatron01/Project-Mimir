# E0 - naive RAG baseline (reference arm). Production retrieval + production v1 prompt,
# generated locally so model, temperature and seed are controlled.
name: E0
description: "Naive RAG: top-3 semantic chunks -> whole exam in one call, qwen2.5:7b on Ollama"
