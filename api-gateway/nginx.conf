# GDPR: az access log paraméterek (?user_id=...) nélkül és rövidített IP-címmel készül.
# IPv4: utolsó oktett nullázva (1.2.3.0), IPv6: csak az első két blokk marad.
map $remote_addr $remote_addr_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+    $ip.0;
    ~(?P<ip>[^:]+:[^:]+):          $ip::;
    default                        0.0.0.0;
}

log_format mimir_anon '$remote_addr_anon - [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log mimir_anon;
    # Az error log a teljes kérést (query stringgel, IP-vel) naplózná, ezért csak kritikus hibákat írunk.
    # Upstream hibák a szolgáltatások saját naplóiban láthatók.
    error_log /var/log/nginx/error.log crit;
    
    # Maximális feltöltési méret (hogy a PDF-ek is átmenjenek)
    client_max_body_size 50M;

    proxy_read_timeout 3000;
    proxy_connect_timeout 3000;
    proxy_send_timeout 3000;
    send_timeout 3000;

    # KIKOMMENTELVE: A CORS-t a FastAPI modulok (CORSMiddleware) kezelik a háttérben!
    # add_header 'Access-Control-Allow-Origin' '*' always;
    # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    # add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    # Irányítások a mikroszolgáltatásokhoz
    location /api/v1/extract {
        proxy_pass http://wellspring:8000;
    }
    location /api/v1/chunk {
        proxy_pass http://runecarver:8000;
    }
    location /api/v1/ingest {
        proxy_pass http://bifrost:8000;
    }
    location /api/v1/search {
        proxy_pass http://bifrost:8000;
    }
    location /api/v1/generate {
        proxy_pass http://bifrost:8000;
    }
    location /api/v1/export {
        proxy_pass http://skald:8000;
    }
    location /api/v1/status/ {
        proxy_pass http://bifrost:8000;
    }
    # Választható modellek + várható generálási idő (FE-11, GDPR-06 értesítés)
    location = /api/v1/models {
        proxy_pass http://bifrost:8000;
    }
    location /api/v1/tests {
        proxy_pass http://skald:8000;
    }
    location /api/v1/tests/download/ {
        proxy_pass http://skald:8000;
    }
}