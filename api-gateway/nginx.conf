server {
    listen 80;
    
    # Maximális feltöltési méret (hogy a PDF-ek is átmenjenek)
    client_max_body_size 50M;

    proxy_read_timeout 3000;
    proxy_connect_timeout 3000;
    proxy_send_timeout 3000;
    send_timeout 3000;

    # 1. FEJLÉCEK TOVÁBBÍTÁSA: Ebből tudja a backend, hogy honnan jött a kérés
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 2. KÖZPONTOSÍTOTT CORS KEZELÉS (Nginx szinten)
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';
    proxy_hide_header 'Access-Control-Allow-Credentials';

    # Hozzáadjuk a stabil CORS fejléceket minden válaszhoz
    add_header 'Access-Control-Allow-Origin' 'https://mimir-ai.hu' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # 3. PREFLIGHT (OPTIONS) KÉRÉSEK KEZELÉSE
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'https://mimir-ai.hu' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Irányítások a mikroszolgáltatásokhoz
    location /api/v1/extract {
        proxy_pass http://wellspring:8000;
    }
    location /api/v1/chunk {
        proxy_pass http://runecarver:8000;
    }
    location /api/v1/ingest {
        proxy_pass http://bifrost:8000;
    }
    location /api/v1/search {
        proxy_pass http://bifrost:8000;
    }
    location /api/v1/generate {
        proxy_pass http://bifrost:8000;
    }
    location /api/v1/export {
        proxy_pass http://skald:8000;
    }
    location /api/v1/status/ {
        proxy_pass http://bifrost:8000;
    }
    location /api/v1/tests {
        proxy_pass http://skald:8000;
    }
    location /api/v1/tests/download/ {
        proxy_pass http://skald:8000;
    }
}